<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gallery Tunnel</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.147.0/build/three.min.js"></script>
    <style>
      *,
      *::before,
      *::after {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        background: #000;
        overflow: hidden;
      }
      #gt-root {
        position: relative;
        width: 100vw;
        height: 100vh;
        overflow: hidden;
      }
      #gt-backdrop {
        position: absolute;
        inset: 0;
        background: #000000;
      }
      #gt-canvas {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
      }
      #gt-assets {
        position: absolute;
        top: 0;
        left: 0;
        width: 1px;
        height: 1px;
        overflow: hidden;
        opacity: 0;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div
      id="gt-root"
      data-composition-id="gallery-tunnel"
      data-root="true"
      data-composition-variables='[
        {"id":"images","type":"string","label":"Image slots","default":""},
        {"id":"imageMix","type":"number","label":"Image share of filled slots","default":1,"min":0,"max":1,"step":0.05},
        {"id":"speed","type":"number","label":"Flight speed","default":1.5,"min":0,"max":8,"step":0.1,"unit":"segments/s"},
        {"id":"palette","type":"string","label":"Slab palette","default":"#FF6A00,#AB54F7,#EA3737,#0072E3,#00AA3C,#FFB200"},
        {"id":"grid","type":"number","label":"Grid density","default":2,"min":1,"max":4,"step":1},
        {"id":"fill","type":"number","label":"Slot fill rate","default":0.5,"min":0,"max":1,"step":0.05},
        {"id":"fog","type":"number","label":"Fog distance","default":14.25,"min":3,"max":14.5,"step":0.25,"unit":"segments"},
        {"id":"edgeColor","type":"color","label":"Edge line colour","default":"#B0B0B0"},
        {"id":"edgeOpacity","type":"number","label":"Edge line opacity","default":0.5,"min":0,"max":1,"step":0.05},
        {"id":"backdrop","type":"color","label":"Backdrop and fog colour","default":"#000000"}
      ]'
    >
      <div id="gt-backdrop"></div>
      <canvas id="gt-canvas"></canvas>
      <div id="gt-assets" aria-hidden="true" data-layout-allow-overflow></div>
    </div>

    <script>
      (function () {
        var DUR = 12;
        var W = window.innerWidth;
        var H = window.innerHeight;

        // Fixed tunnel geometry, measured off the reference.
        var TUNNEL_WIDTH = 2;
        var TUNNEL_HEIGHT = 1.8;
        var SEGMENT_DEPTH = 1;
        var NUM_SEGMENTS = 15;
        var LINE_RADIUS = 0.003;
        var FOV = 75;
        var INSET = 0.94; // slab gutter inside its cell, so tiles read as discrete
        var SKIN = 0.002; // push slabs just behind the wall plane so edges stay on top

        var ROOT = document.getElementById("gt-root");
        var CS = getComputedStyle(ROOT);

        var DECL = {};
        JSON.parse(ROOT.getAttribute("data-composition-variables") || "[]").forEach(function (v) {
          DECL[v.id] = v.default;
        });
        var HF = window.__hyperframes;
        var V = (HF && HF.getVariables && HF.getVariables()) || {};

        function raw(id) {
          var css = CS.getPropertyValue("--" + id.toLowerCase()).trim();
          if (css !== "") return css;
          if (V[id] !== undefined && V[id] !== "") return V[id];
          return DECL[id];
        }
        function num(id) {
          var n = parseFloat(raw(id));
          return isFinite(n) ? n : 0;
        }
        function str(id) {
          var s = raw(id);
          return typeof s === "string" ? s.trim() : "";
        }
        function list(id) {
          return str(id)
            .split(",")
            .map(function (s) {
              return s.trim();
            })
            .filter(function (s) {
              return s !== "";
            });
        }

        var SPEED = num("speed");
        var GRID = Math.max(1, Math.min(4, Math.round(num("grid"))));
        var FILL = num("fill");
        var IMAGE_MIX = num("imageMix");
        var FOG_FAR = Math.max(3, Math.min(14.5, num("fog")));
        var EDGE_OPACITY = num("edgeOpacity");
        var EDGE_COLOR = str("edgeColor");
        var BACKDROP = str("backdrop");
        var PALETTE = list("palette");
        var IMAGE_SRCS = list("images");

                if (IMAGE_SRCS.length === 0) {
            IMAGE_SRCS = [
              'https://res.cloudinary.com/dn72rhl1a/image/upload/q_auto,f_jpg,w_800/v1789150857/p8bajc1r1qixawao3s8q.jpg',
              'https://res.cloudinary.com/dn72rhl1a/image/upload/q_auto,f_jpg,w_800/v1789150861/nar6uiwrufdjenq6jked.jpg',
              'https://res.cloudinary.com/dn72rhl1a/image/upload/q_auto,f_jpg,w_800/v1789150864/ltsey7jv4yer4mpla0fe.jpg',
              'https://res.cloudinary.com/dn72rhl1a/image/upload/q_auto,f_jpg,w_800/v1789150869/k7j8bmietei6i5nnspgw.jpg',
              'https://res.cloudinary.com/dn72rhl1a/image/upload/q_auto,f_jpg,w_800/v1789150874/mwvvtxtwj2m9wlkqh5yh.jpg',
              'https://res.cloudinary.com/dn72rhl1a/image/upload/q_auto,f_jpg,w_800/v1789150878/ykdlg8gjmrj0fyk79qmm.jpg',
              'https://res.cloudinary.com/dn72rhl1a/image/upload/q_auto,f_jpg,w_800/v1789150882/oz6hfwkqlzppjolvfhl5.jpg',
              'https://res.cloudinary.com/dn72rhl1a/image/upload/q_auto,f_jpg,w_800/v1789150886/kcz3zquesr98xpsdxfm8.jpg',
              'https://res.cloudinary.com/dn72rhl1a/image/upload/q_auto,f_jpg,w_800/v1789150891/lbpfqruhiv2gnjy6zzi8.jpg',
              'https://res.cloudinary.com/dn72rhl1a/image/upload/q_auto,f_jpg,w_800/v1789150895/xj5f1awtf9lmvgossa3c.jpg',
              'https://res.cloudinary.com/dn72rhl1a/image/upload/q_auto,f_jpg,w_800/v1789150898/ivjejcyai0wjp1o2noij.jpg',
              'https://res.cloudinary.com/dn72rhl1a/image/upload/q_auto,f_jpg,w_800/v1789150902/kswsxmtkbligwjvsovgq.jpg',
              'https://res.cloudinary.com/dn72rhl1a/image/upload/q_auto,f_jpg,w_800/v1789150905/qoeg5p3pppkevx8hpls0.jpg',
              'https://res.cloudinary.com/dn72rhl1a/image/upload/q_auto,f_jpg,w_800/v1789150909/ne6t02iw87crszhn2bvf.jpg',
              'https://res.cloudinary.com/dn72rhl1a/image/upload/q_auto,f_jpg,w_800/v1789150913/d9dje905snc4qt4iecaj.jpg',
              'https://res.cloudinary.com/dn72rhl1a/image/upload/q_auto,f_jpg,w_800/v1789150916/cnod4bbu5i2okwhhdd37.jpg',
              'https://res.cloudinary.com/dn72rhl1a/image/upload/q_auto,f_jpg,w_800/v1789150920/klc5m8mu6ammepuhoibx.jpg',
              'https://res.cloudinary.com/dn72rhl1a/image/upload/q_auto,f_jpg,w_800/v1789150924/c4xli86n2ocibmqx0nxa.jpg',
              'https://res.cloudinary.com/dn72rhl1a/image/upload/q_auto,f_jpg,w_800/v1789150928/o4qyi3w9oqngdcnopwzg.jpg',
              'https://res.cloudinary.com/dn72rhl1a/image/upload/q_auto,f_jpg,w_800/v1789150931/grpfcmaahvuvpoflhppo.jpg'
            ];
            
            // Randomize array in-place
            for (var i = IMAGE_SRCS.length - 1; i > 0; i--) {
                var j = Math.floor(Math.random() * (i + 1));
                var temp = IMAGE_SRCS[i];
                IMAGE_SRCS[i] = IMAGE_SRCS[j];
                IMAGE_SRCS[j] = temp;
            }
        }

        document.getElementById("gt-backdrop").style.background = BACKDROP;

        var BACK = Math.max(0, Math.min(1.5, NUM_SEGMENTS * SEGMENT_DEPTH - FOG_FAR));

        function hash2(a, b) {
          var h = Math.imul(a | 0, 0x27d4eb2d) ^ Math.imul(b | 0, 0x165667b1);
          h = Math.imul(h ^ (h >>> 15), 0x2545f491);
          h ^= h >>> 13;
          return (h >>> 0) / 4294967296;
        }

        var THREEJS = window.THREE;
        var canvas = document.getElementById("gt-canvas");
        var renderer = new THREEJS.WebGLRenderer({
          canvas: canvas,
          antialias: true,
          alpha: false,
          preserveDrawingBuffer: true,
        });
        renderer.setPixelRatio(window.devicePixelRatio || 1);
        renderer.setSize(W, H, false);
        renderer.setClearColor(new THREEJS.Color(BACKDROP), 1);

        var scene = new THREEJS.Scene();
        scene.fog = new THREEJS.Fog(new THREEJS.Color(BACKDROP), 1, FOG_FAR * SEGMENT_DEPTH);

        var camera = new THREEJS.PerspectiveCamera(FOV, W / H, 0.05, 40);
        camera.position.set(0, 0, 0);
        camera.lookAt(0, 0, -1);

        window.addEventListener('resize', function() {
            W = window.innerWidth;
            H = window.innerHeight;
            camera.aspect = W / H;
            camera.updateProjectionMatrix();
            renderer.setSize(W, H, false);
        });

        var PLANE = new THREEJS.PlaneGeometry(1, 1);

        var COLOR_MATS = PALETTE.map(function (hex) {
          return new THREEJS.MeshBasicMaterial({ color: new THREEJS.Color(hex), fog: true });
        });
        if (COLOR_MATS.length === 0) {
          COLOR_MATS.push(new THREEJS.MeshBasicMaterial({ color: 0xffffff, fog: true }));
        }

        var assets = document.getElementById("gt-assets");
        var IMAGES = IMAGE_SRCS.map(function (src, k) {
          var el = document.createElement("img");
          el.id = "gt-img-" + k;
          el.alt = "";
          el.crossOrigin = "anonymous";
          el.src = src;
          assets.appendChild(el);

          var tex = new THREEJS.Texture(el);
          tex.minFilter = THREEJS.LinearFilter;
          tex.magFilter = THREEJS.LinearFilter;
          tex.generateMipmaps = false;
          
          var emptyMat = new THREEJS.MeshBasicMaterial({ color: 0x222222, fog: true });
          var loadedMat = new THREEJS.MeshBasicMaterial({ map: tex, color: 0xffffff, fog: true });
          
          var rec = {
            aspect: 0,
            mat: emptyMat,
          };
          function ready() {
            if (!el.naturalWidth) return;
            rec.aspect = el.naturalWidth / el.naturalHeight;
            rec.mat = loadedMat;
            tex.needsUpdate = true;
          }
          el.addEventListener("load", ready);
          ready();
          return rec;
        });

        var edgeMat = new THREEJS.MeshBasicMaterial({
          color: new THREEJS.Color(EDGE_COLOR),
          fog: true,
          transparent: true,
          opacity: EDGE_OPACITY,
        });

        var HW = TUNNEL_WIDTH / 2;
        var HH = TUNNEL_HEIGHT / 2;
        var cellZ = SEGMENT_DEPTH / GRID;
        var cellX = TUNNEL_WIDTH / GRID;
        var cellY = TUNNEL_HEIGHT / GRID;

        var FACES = [
          {
            rot: [-Math.PI / 2, 0, 0],
            cw: cellX,
            ch: cellZ,
            place: function (iu, iz) {
              return [-HW + (iu + 0.5) * cellX, -HH - SKIN, -(iz + 0.5) * cellZ];
            },
          },
          {
            rot: [Math.PI / 2, 0, 0],
            cw: cellX,
            ch: cellZ,
            place: function (iu, iz) {
              return [-HW + (iu + 0.5) * cellX, HH + SKIN, -(iz + 0.5) * cellZ];
            },
          },
          {
            rot: [0, Math.PI / 2, 0],
            cw: cellZ,
            ch: cellY,
            place: function (iu, iz) {
              return [-HW - SKIN, -HH + (iu + 0.5) * cellY, -(iz + 0.5) * cellZ];
            },
          },
          {
            rot: [0, -Math.PI / 2, 0],
            cw: cellZ,
            ch: cellY,
            place: function (iu, iz) {
              return [HW + SKIN, -HH + (iu + 0.5) * cellY, -(iz + 0.5) * cellZ];
            },
          },
        ];

        var UP = new THREEJS.Vector3(0, 1, 0);
        function tube(group, ax, ay, az, bx, by, bz) {
          var dx = bx - ax,
            dy = by - ay,
            dz = bz - az;
          var len = Math.sqrt(dx * dx + dy * dy + dz * dz);
          if (len < 1e-6) return;
          var mesh = new THREEJS.Mesh(
            new THREEJS.CylinderGeometry(LINE_RADIUS, LINE_RADIUS, len, 6, 1),
            edgeMat,
          );
          mesh.position.set((ax + bx) / 2, (ay + by) / 2, (az + bz) / 2);
          mesh.quaternion.setFromUnitVectors(UP, new THREEJS.Vector3(dx / len, dy / len, dz / len));
          group.add(mesh);
        }

        function buildEdges(group) {
          var D = SEGMENT_DEPTH;
          var k, j, u, z;
          for (k = 1; k < GRID; k++) {
            u = -HW + k * cellX;
            tube(group, u, -HH, 0, u, -HH, -D);
            tube(group, u, HH, 0, u, HH, -D);
          }
          for (k = 0; k <= GRID; k++) {
            u = -HH + k * cellY;
            tube(group, -HW, u, 0, -HW, u, -D);
            tube(group, HW, u, 0, HW, u, -D);
          }
          for (j = 0; j < GRID; j++) {
            z = -j * cellZ;
            tube(group, -HW, -HH, z, HW, -HH, z);
            tube(group, -HW, HH, z, HW, HH, z);
            tube(group, -HW, -HH, z, -HW, HH, z);
            tube(group, HW, -HH, z, HW, HH, z);
          }
        }

        var segs = [];
        for (var i = 0; i < NUM_SEGMENTS; i++) {
          var group = new THREEJS.Group();
          var panels = [];
          for (var f = 0; f < FACES.length; f++) {
            var face = FACES[f];
            for (var iz = 0; iz < GRID; iz++) {
              for (var iu = 0; iu < GRID; iu++) {
                var mesh = new THREEJS.Mesh(PLANE, COLOR_MATS[0]);
                var p = face.place(iu, iz);
                mesh.position.set(p[0], p[1], p[2]);
                mesh.rotation.set(face.rot[0], face.rot[1], face.rot[2]);
                mesh.visible = false;
                group.add(mesh);
                panels.push({ mesh: mesh, cw: face.cw * INSET, ch: face.ch * INSET });
              }
            }
          }
          buildEdges(group);
          scene.add(group);
          segs.push({ group: group, panels: panels });
        }

        function fit(p, ar) {
          p.mesh.scale.set(p.cw, p.ch, 1);
        }

        function draw(t) {
          var d = SPEED * t;
          for (var i = 0; i < NUM_SEGMENTS; i++) {
            var seg = segs[i];
            var a = i + NUM_SEGMENTS * Math.ceil((d - i - BACK) / NUM_SEGMENTS);
            seg.group.position.z = -(a - d) * SEGMENT_DEPTH;

            var lit = a % 2 === 0;
            var panels = seg.panels;
            for (var s = 0; s < panels.length; s++) {
              var p = panels[s];
              if (!lit || hash2(a, s * 4 + 1) >= FILL) {
                p.mesh.visible = false;
                continue;
              }
              p.mesh.visible = true;
              if (IMAGES.length > 0 && hash2(a, s * 4 + 2) < IMAGE_MIX) {
                var im = IMAGES[Math.floor(hash2(a, s * 4 + 4) * IMAGES.length) % IMAGES.length];
                p.mesh.material = im.mat;
                fit(p, im.aspect);
              } else {
                var ci = Math.floor(hash2(a, s * 4 + 3) * COLOR_MATS.length) % COLOR_MATS.length;
                p.mesh.material = COLOR_MATS[ci];
                p.mesh.scale.set(p.cw, p.ch, 1);
              }
            }
          }
          renderer.render(scene, camera);
        }

        var tl = gsap.timeline({ repeat: -1 });

        var driver = { _t: 0 };
        Object.defineProperty(driver, "t", {
          get: function () {
            return this._t;
          },
          set: function (v) {
            this._t = v;
            draw(v);
          },
        });
        tl.to(driver, { t: DUR, duration: DUR, ease: "none" }, 0);

        draw(0);
      })();
    </script>
  </body>
</html>
